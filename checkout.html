<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout | Tiana's Inn</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="navbar">

        <a href="index.html" class="logo">
            TIANA'S INN
        </a>

        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="cart.html">Shopping Cart</a>
        </nav>

    </header>

    <main class="checkout-section">

        <div class="section-heading">
            <p class="section-label">ALMOST THERE</p>
            <h2>CHECKOUT</h2>
        </div>

        <form id="checkout-form">

            <div class="order-summary">

                <h3>Your Order</h3>

                <div id="checkout-items">
                    <!-- Products will appear here -->
                </div>

                <div class="checkout-total">
                    <h3>Total: <span id="checkout-total">GH₵0.00</span></h3>
                </div>

            </div>

            <h3>Customer Information</h3>

            <label for="customer-name">Full Name</label>
            <input type="text" id="customer-name" name="customer-name" placeholder="Enter your full name" required>

            <label for="customer-phone">Phone Number</label>
            <input type="tel" id="customer-phone" name="customer-phone" placeholder="Enter your phone number" required>

            <label for="customer-email">Email Address</label>
            <input type="email" id="customer-email" name="customer-email" placeholder="Enter your email address">

            <label for="delivery-address">Delivery Address</label>
            <textarea id="delivery-address" name="delivery-address" placeholder="Enter your delivery address"
                required></textarea>

            <button type="submit">PLACE ORDER</button>

        </form>

    </main>

    <script type="module" src="dist/checkout.js"></script>

</body>

</html>
