<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard | Tiana's Inn</title>

    <link rel="stylesheet" href="./css/style.css">
</head>

<body class="admin-body">

    <div class="admin-layout">

        <!-- Sidebar -->
        <aside class="admin-sidebar">

            <h2>TIANA'S INN</h2>
            <p class="admin-label">ADMIN PANEL</p>

            <nav>
                <a href="admin.html" class="active">Dashboard</a>
                <a href="admin-products.html">Products</a>
                <a href="#">Orders</a>
                <a href="#">Customers</a>
                <a href="#">Settings</a>
            </nav>

            <a href="index.html" class="back-to-store">
                View Store
            </a>

        </aside>

        <!-- Main Dashboard -->
        <main class="admin-main">

            <header class="admin-topbar">
                <div>
                    <h1>Dashboard</h1>
                    <p>Welcome to your store management panel.</p>
                </div>

                <span>Administrator</span>
            </header>

            <!-- Overview Cards -->
            <section class="dashboard-cards">

                <article class="dashboard-card">
                    <h3>Total Products</h3>
                    <p>4</p>
                </article>

                <article class="dashboard-card">
                    <h3>Pending Products</h3>
                    <p>0</p>
                </article>

                <article class="dashboard-card">
                    <h3>Total Orders</h3>
                    <p>0</p>
                </article>

                <article class="dashboard-card">
                    <h3>Total Customers</h3>
                    <p>0</p>
                </article>

            </section>

            <!-- Recent Activity -->
            <section class="admin-section">
                <h2>Recent Activity</h2>
                <p>Your store activities will appear here.</p>
            </section>

        </main>

    </div>

</body>

</html>
