<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Products | Tiana's Inn</title>

    <link rel="stylesheet" href="./css/style.css">
</head>

<body class="admin-body">

    <div class="admin-layout">

        <!-- Sidebar -->
        <aside class="admin-sidebar">

            <h2>TIANA'S INN</h2>
            <p class="admin-label">ADMIN PANEL</p>

            <nav>
                <a href="admin.html">Dashboard</a>
                <a href="admin-products.html" class="active">Products</a>
                <a href="#">Orders</a>
                <a href="#">Customers</a>
                <a href="#">Settings</a>
            </nav>

            <a href="index.html" class="back-to-store">
                View Store
            </a>

        </aside>

        <!-- Main Content -->
        <main class="admin-main">

            <header class="admin-topbar">
                <div>
                    <h1>Product Management</h1>
                    <p>Manage your store inventory and product approvals.</p>
                </div>

                <span>Administrator</span>
            </header>

            <!-- Product Statistics -->
            <section class="dashboard-cards">

                <article class="dashboard-card">
                    <h3>Total Products</h3>
                    <p>4</p>
                </article>

                <article class="dashboard-card">
                    <h3>Approved</h3>
                    <p>4</p>
                </article>

                <article class="dashboard-card">
                    <h3>Pending</h3>
                    <p>0</p>
                </article>

                <article class="dashboard-card">
                    <h3>Rejected</h3>
                    <p>0</p>
                </article>

            </section>

            <!-- Product Management Area -->

            <section class="admin-section">

                <h2>Add New Product</h2>

                <p>Enter the details of the product you want to add.</p>

                <form id="add-product-form">

                    <div class="admin-form-group">
                        <label for="product-name">Product Name</label>
                        <input type="text" id="product-name" placeholder="e.g. Premium Polo Shirt" required>
                    </div>

                    <div class="admin-form-group">
                        <label for="product-category">Category</label>
                        <select id="product-category" required>
                            <option value="">Select a category</option>
                            <option value="SHIRTS">Shirts</option>
                            <option value="T-SHIRTS">T-Shirts</option>
                            <option value="TROUSERS">Trousers</option>
                            <option value="SHOES">Shoes</option>
                        </select>
                    </div>

                    <div class="admin-form-group">
                        <label for="product-price">Price (GH₵)</label>
                        <input type="number" id="product-price" placeholder="e.g. 250" min="1" step="0.01" required>
                    </div>

                    <div class="admin-form-group">
                        <label for="product-image">Product Image Path</label>
                        <input type="text" id="product-image" placeholder="e.g. images/polo-shirt.jpeg" required>
                    </div>

                    <div class="admin-form-group">
                        <label>
                            <input type="checkbox" id="product-featured">
                            Display as a featured product
                        </label>
                    </div>

                    <button type="submit" class="admin-submit-button">
                        ADD PRODUCT
                    </button>

                </form>

            </section>


        </main>

    </div>

</body>

</html>
